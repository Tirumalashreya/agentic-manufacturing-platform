apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: aps-platform
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: aps_platform }
            - { name: POSTGRES_USER, value: aps }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: aps-secrets, key: POSTGRES_PASSWORD } }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "aps", "-d", "aps_platform"] }
            initialDelaySeconds: 5
  volumeClaimTemplates:
    - metadata: { name: pgdata }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aps-platform
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
