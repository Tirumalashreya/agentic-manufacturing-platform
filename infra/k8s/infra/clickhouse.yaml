apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: aps-platform
spec:
  serviceName: clickhouse
  replicas: 1
  selector: { matchLabels: { app: clickhouse } }
  template:
    metadata: { labels: { app: clickhouse } }
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24-alpine
          ports:
            - { containerPort: 8123 }
            - { containerPort: 9000 }
          volumeMounts:
            - { name: chdata, mountPath: /var/lib/clickhouse }
  volumeClaimTemplates:
    - metadata: { name: chdata }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: aps-platform
spec:
  selector: { app: clickhouse }
  ports:
    - { name: http, port: 8123, targetPort: 8123 }
    - { name: native, port: 9000, targetPort: 9000 }
