apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-integration
  namespace: aps-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: erp-integration } }
  template:
    metadata: { labels: { app: erp-integration } }
    spec:
      containers:
        - name: erp-integration
          image: aps/erp-integration:latest
          ports: [{ containerPort: 4018 }]
          env:
            - { name: SERVICE_NAME, value: "erp-integration" }
            - { name: PORT, value: "4018" }
          envFrom:
            - configMapRef: { name: aps-config }
            - secretRef: { name: aps-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4018 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4018 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: erp-integration
  namespace: aps-platform
spec:
  selector: { app: erp-integration }
  ports: [{ port: 4018, targetPort: 4018 }]
