apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-service
  namespace: aps-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: maintenance-service } }
  template:
    metadata: { labels: { app: maintenance-service } }
    spec:
      containers:
        - name: maintenance-service
          image: aps/maintenance-service:latest
          ports: [{ containerPort: 4012 }]
          env:
            - { name: SERVICE_NAME, value: "maintenance-service" }
            - { name: PORT, value: "4012" }
          envFrom:
            - configMapRef: { name: aps-config }
            - secretRef: { name: aps-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4012 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4012 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: maintenance-service
  namespace: aps-platform
spec:
  selector: { app: maintenance-service }
  ports: [{ port: 4012, targetPort: 4012 }]
