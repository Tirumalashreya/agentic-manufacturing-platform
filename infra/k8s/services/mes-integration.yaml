apiVersion: apps/v1
kind: Deployment
metadata:
  name: mes-integration
  namespace: aps-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: mes-integration } }
  template:
    metadata: { labels: { app: mes-integration } }
    spec:
      containers:
        - name: mes-integration
          image: aps/mes-integration:latest
          ports: [{ containerPort: 4019 }]
          env:
            - { name: SERVICE_NAME, value: "mes-integration" }
            - { name: PORT, value: "4019" }
          envFrom:
            - configMapRef: { name: aps-config }
            - secretRef: { name: aps-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4019 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4019 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mes-integration
  namespace: aps-platform
spec:
  selector: { app: mes-integration }
  ports: [{ port: 4019, targetPort: 4019 }]
