apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: aps-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service } }
    spec:
      containers:
        - name: order-service
          image: aps/order-service:latest
          ports: [{ containerPort: 4001 }]
          env:
            - { name: SERVICE_NAME, value: "order-service" }
            - { name: PORT, value: "4001" }
          envFrom:
            - configMapRef: { name: aps-config }
            - secretRef: { name: aps-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4001 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4001 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: aps-platform
spec:
  selector: { app: order-service }
  ports: [{ port: 4001, targetPort: 4001 }]
