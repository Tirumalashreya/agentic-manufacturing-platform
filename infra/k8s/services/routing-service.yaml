apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-service
  namespace: aps-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: routing-service } }
  template:
    metadata: { labels: { app: routing-service } }
    spec:
      containers:
        - name: routing-service
          image: aps/routing-service:latest
          ports: [{ containerPort: 4002 }]
          env:
            - { name: SERVICE_NAME, value: "routing-service" }
            - { name: PORT, value: "4002" }
          envFrom:
            - configMapRef: { name: aps-config }
            - secretRef: { name: aps-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: routing-service
  namespace: aps-platform
spec:
  selector: { app: routing-service }
  ports: [{ port: 4002, targetPort: 4002 }]
