apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: aps-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      containers:
        - name: notification-service
          image: aps/notification-service:latest
          ports: [{ containerPort: 4014 }]
          env:
            - { name: SERVICE_NAME, value: "notification-service" }
            - { name: PORT, value: "4014" }
          envFrom:
            - configMapRef: { name: aps-config }
            - secretRef: { name: aps-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4014 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4014 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: aps-platform
spec:
  selector: { app: notification-service }
  ports: [{ port: 4014, targetPort: 4014 }]
