apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-service
  namespace: aps-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: tool-service } }
  template:
    metadata: { labels: { app: tool-service } }
    spec:
      containers:
        - name: tool-service
          image: aps/tool-service:latest
          ports: [{ containerPort: 4011 }]
          env:
            - { name: SERVICE_NAME, value: "tool-service" }
            - { name: PORT, value: "4011" }
          envFrom:
            - configMapRef: { name: aps-config }
            - secretRef: { name: aps-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4011 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4011 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tool-service
  namespace: aps-platform
spec:
  selector: { app: tool-service }
  ports: [{ port: 4011, targetPort: 4011 }]
