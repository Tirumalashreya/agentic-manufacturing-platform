apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-ingestion
  namespace: aps-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: iot-ingestion } }
  template:
    metadata: { labels: { app: iot-ingestion } }
    spec:
      containers:
        - name: iot-ingestion
          image: aps/iot-ingestion:latest
          ports: [{ containerPort: 4020 }]
          env:
            - { name: SERVICE_NAME, value: "iot-ingestion" }
            - { name: PORT, value: "4020" }
          envFrom:
            - configMapRef: { name: aps-config }
            - secretRef: { name: aps-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4020 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4020 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: iot-ingestion
  namespace: aps-platform
spec:
  selector: { app: iot-ingestion }
  ports: [{ port: 4020, targetPort: 4020 }]
