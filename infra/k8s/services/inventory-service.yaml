apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: aps-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: inventory-service } }
  template:
    metadata: { labels: { app: inventory-service } }
    spec:
      containers:
        - name: inventory-service
          image: aps/inventory-service:latest
          ports: [{ containerPort: 4010 }]
          env:
            - { name: SERVICE_NAME, value: "inventory-service" }
            - { name: PORT, value: "4010" }
          envFrom:
            - configMapRef: { name: aps-config }
            - secretRef: { name: aps-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4010 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4010 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: aps-platform
spec:
  selector: { app: inventory-service }
  ports: [{ port: 4010, targetPort: 4010 }]
