apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: aps-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: analytics-service } }
  template:
    metadata: { labels: { app: analytics-service } }
    spec:
      containers:
        - name: analytics-service
          image: aps/analytics-service:latest
          ports: [{ containerPort: 4017 }]
          env:
            - { name: SERVICE_NAME, value: "analytics-service" }
            - { name: PORT, value: "4017" }
          envFrom:
            - configMapRef: { name: aps-config }
            - secretRef: { name: aps-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4017 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4017 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: aps-platform
spec:
  selector: { app: analytics-service }
  ports: [{ port: 4017, targetPort: 4017 }]
