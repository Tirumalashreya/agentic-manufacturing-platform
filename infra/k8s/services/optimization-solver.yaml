apiVersion: apps/v1
kind: Deployment
metadata:
  name: optimization-solver
  namespace: aps-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: optimization-solver } }
  template:
    metadata: { labels: { app: optimization-solver } }
    spec:
      containers:
        - name: optimization-solver
          image: aps/optimization-solver:latest
          ports: [{ containerPort: 4007 }]
          env:
            - { name: SERVICE_NAME, value: "optimization-solver" }
            - { name: PORT, value: "4007" }
          envFrom:
            - configMapRef: { name: aps-config }
            - secretRef: { name: aps-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4007 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4007 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: optimization-solver
  namespace: aps-platform
spec:
  selector: { app: optimization-solver }
  ports: [{ port: 4007, targetPort: 4007 }]
