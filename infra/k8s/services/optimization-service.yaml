apiVersion: apps/v1
kind: Deployment
metadata:
  name: optimization-service
  namespace: aps-platform
spec:
  # Baseline for the HPA below (§15: "Optimization Service workers auto-scale
  # 2→20 pods"); the HPA's minReplicas takes over management of this field
  # once applied.
  replicas: 2
  selector: { matchLabels: { app: optimization-service } }
  template:
    metadata: { labels: { app: optimization-service } }
    spec:
      containers:
        - name: optimization-service
          image: aps/optimization-service:latest
          ports: [{ containerPort: 4006 }]
          env:
            - { name: SERVICE_NAME, value: "optimization-service" }
            - { name: PORT, value: "4006" }
          envFrom:
            - configMapRef: { name: aps-config }
            - secretRef: { name: aps-secrets }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 4006 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4006 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: optimization-service
  namespace: aps-platform
spec:
  selector: { app: optimization-service }
  ports: [{ port: 4006, targetPort: 4006 }]
