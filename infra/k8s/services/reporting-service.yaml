apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: aps-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: reporting-service } }
  template:
    metadata: { labels: { app: reporting-service } }
    spec:
      containers:
        - name: reporting-service
          image: aps/reporting-service:latest
          ports: [{ containerPort: 4016 }]
          env:
            - { name: SERVICE_NAME, value: "reporting-service" }
            - { name: PORT, value: "4016" }
          envFrom:
            - configMapRef: { name: aps-config }
            - secretRef: { name: aps-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4016 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4016 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: aps-platform
spec:
  selector: { app: reporting-service }
  ports: [{ port: 4016, targetPort: 4016 }]
